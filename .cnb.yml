main:
  push:
    - name: freeze-gate
      services:
        - docker
      docker:
        image: node:22-bookworm
      env:
        CI: 'true'
        DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/template_test?schema=public
      stages:
        - name: prepare-pnpm
          script: corepack enable && corepack prepare pnpm@11.9.0 --activate
        - name: start-postgresql
          script: docker run -d --name template-postgres -e POSTGRES_DB=template_test -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -p 5432:5432 postgres:17-alpine
        - name: wait-postgresql
          script: until docker exec template-postgres pg_isready -U postgres -d template_test; do sleep 1; done
        - name: install
          script: pnpm install --frozen-lockfile
        - name: quality-gate
          script: pnpm check
        - name: template-clean-room
          script: pnpm template:verify
        - name: migrate
          script: pnpm --filter @template/api exec prisma migrate deploy
        - name: seed
          script: DEV_ADMIN_PHONE=13800000000 DEV_ADMIN_PASSWORD=Admin@123456 pnpm db:seed
        - name: prisma-e2e
          script: E2E_DATA_SOURCE=prisma pnpm test:e2e
        - name: build-api-image
          script: docker build -f apps/api/Dockerfile -t adminback-api:${CNB_COMMIT_SHORT} .
        - name: build-admin-image
          script: docker build -f apps/admin/Dockerfile -t adminback-admin:${CNB_COMMIT_SHORT} .
